name: Zora Neon Function bundle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'server/src/**'
      - '.github/workflows/neon-function-bundle.yml'
permissions:
  contents: read
jobs:
  bundle-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install function build dependencies
        run: npm install --no-save --no-audit --no-fund pg@^8.14.1 esbuild@^0.25.0
      - name: Bundle HTTP function and database adapter
        shell: bash
        run: |
          mkdir -p function-dist
          npx esbuild functions/license/index.mjs --bundle --platform=node --target=node24 --format=esm --packages=bundle --external:pg-native --banner:js="import { createRequire as __createRequire } from 'node:module'; const require = __createRequire(import.meta.url);" --outfile=function-dist/index.mjs
          cd function-dist && zip -q -9 ../zora-license-function.zip index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zora-license-function
          path: zora-license-function.zip
          retention-days: 7
      - name: Export public source bundle for deployment
        shell: bash
        run: |
          echo 'ZORA_FUNCTION_BASE64_BEGIN'
          base64 -w0 zora-license-function.zip | fold -w 120 | sed 's/^/ZORAB64:/'
          echo 'ZORA_FUNCTION_BASE64_END'

name: Zora Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'tests/**'
      - 'shared/**'
      - 'updater/**'
      - 'engine/**'
      - 'server/**'
      - 'admin/**'
      - 'installer/**'
      - 'docs/RELEASES.md'
      - '.github/workflows/windows-build.yml'
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test license logic
        working-directory: server
        run: npm test
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Install extractor dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Test Unity project recovery
        run: python -m unittest discover -s engine/tests -v
      - name: Test WPF theme readability and resource integrity
        run: python -m unittest discover -s desktop/tests -v
      - name: Build bundled UnityPy engine
        run: python -m PyInstaller --onefile --noconfirm --name zora-engine --distpath engine/dist engine/zora_engine.py
      - name: Configure public activation endpoint
        shell: pwsh
        env:
          ZORA_PUBLIC_LICENSE_URL: ${{ vars.ZORA_PUBLIC_LICENSE_URL }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:ZORA_PUBLIC_LICENSE_URL)) {
            if (-not $env:ZORA_PUBLIC_LICENSE_URL.StartsWith("https://")) { throw "Activation endpoint must use HTTPS" }
            $path = "desktop/Zora.Desktop/Services/LicenseService.cs"
            $source = Get-Content -Path $path -Raw
            $escapedUrl = $env:ZORA_PUBLIC_LICENSE_URL.TrimEnd('/').Replace('"', '')
            $source = [regex]::Replace($source, 'private const string ReleaseEndpoint = "[^"]*";', "private const string ReleaseEndpoint = `"$escapedUrl`";")
            Set-Content -Path $path -Value $source -Encoding utf8
          } else {
            Write-Host "No ZORA_PUBLIC_LICENSE_URL configured; build will show activation unavailable until deployed."
          }
      - name: Restore WPF packages
        run: dotnet restore desktop/Zora.Desktop/Zora.Desktop.csproj
      - name: Test managed DLL browser and decompiler
        run: dotnet run --project tests/Zora.ManagedSmoke/Zora.ManagedSmoke.csproj -c Release
      - name: Publish safe portable update helper
        run: dotnet publish updater/Zora.Updater/Zora.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o updater-publish
      - name: Publish native Windows app
        run: dotnet publish desktop/Zora.Desktop/Zora.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Publish owner-only console EXE
        run: dotnet publish admin/Zora.Admin/Zora.Admin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o admin-publish
      - name: Package owner console
        shell: pwsh
        run: |
          Copy-Item updater-publish/ZoraUpdater.exe admin-publish/ZoraUpdater.exe
          Compress-Archive -Path admin-publish/* -DestinationPath ZoraAdmin-Windows-x64.zip -Force
      - name: Include extraction engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/engine | Out-Null
          Copy-Item engine/dist/zora-engine.exe publish/engine/zora-engine.exe
          Copy-Item updater-publish/ZoraUpdater.exe publish/ZoraUpdater.exe
          Compress-Archive -Path publish/* -DestinationPath Zora-Windows-x64.zip -Force
      - name: Build one-click Windows installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe",
            "$env:ProgramFiles\\Inno Setup 6\\ISCC.exe",
            "C:\\ProgramData\\chocolatey\\bin\\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 compiler not found on the Windows runner." }
          & $iscc "installer\\Zora.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (-not (Test-Path "installer-out\\Zora-Setup-x64.exe")) { throw "Installer output missing" }
      - name: Verify unattended install and clean uninstall
        shell: pwsh
        run: |
          $installer = (Resolve-Path "installer-out\\Zora-Setup-x64.exe").Path
          $dest = Join-Path $env:RUNNER_TEMP "zora-setup-smoke"
          $installed = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dest`"") -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Silent installer failed: $($installed.ExitCode)" }
          foreach ($name in @("Zora.exe","ZoraUpdater.exe","engine\\zora-engine.exe",".zora-installed","unins000.exe")) {
            if (-not (Test-Path (Join-Path $dest $name))) { throw "Missing installed component: $name" }
          }
          $removed = Start-Process -FilePath (Join-Path $dest "unins000.exe") -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstaller failed: $($removed.ExitCode)" }
          if (Test-Path (Join-Path $dest "Zora.exe")) { throw "Uninstall did not remove application" }
      - uses: actions/upload-artifact@v4
        with:
          name: Zora-Setup-x64
          path: installer-out/Zora-Setup-x64.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Zora-Windows-x64
          path: Zora-Windows-x64.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ZoraAdmin-Windows-x64
          path: ZoraAdmin-Windows-x64.zip
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    needs: [node-tests, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Zora-Setup-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Zora-Windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ZoraAdmin-Windows-x64
          path: release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Zora-Setup-x64.exe
            release/Zora-Windows-x64.zip
            release/ZoraAdmin-Windows-x64.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.7.0' }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
